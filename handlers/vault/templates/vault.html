<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Neoworks Vault</title>
		<link rel="stylesheet" href="/auth/static/neoworks.css" />
		<script src="/auth/static/libsodium.js"></script>
		<script src="/auth/static/libsodium-wrappers.js"></script>
		<!-- Double Ratchet engine, shared verbatim with the test suite. -->
		<script type="module">
			import { createRatchet } from '/auth/static/chat-ratchet.js';
			import { createScopeKeys, decryptableLabels, writableLabels, spaceOpAllowed } from '/auth/static/scope-keys.js';
			import { createSpaceKeys } from '/auth/static/space-keys.js';
			window.__createRatchet = createRatchet;
			window.__createScopeKeys = createScopeKeys;
			window.__decryptableLabels = decryptableLabels;
			window.__writableLabels = writableLabels;
			window.__spaceOpAllowed = spaceOpAllowed;
			window.__createSpaceKeys = createSpaceKeys;
		</script>
		<!-- E2EE collection stores — contacts, calendar, memories (IndexedDB +
		     codecs + query + sync). Built from packages/sdk/src/vault by
		     `bun run build:vault`; it exposes window.__createVaultStore. The
		     stores live here so embedding apps can never touch the decrypted
		     rows. -->
		<script type="module" src="/auth/static/collections-vault.js"></script>
	</head>
	<body>
		<!-- Deliberately blank. This frame holds keys and stores and renders
		     nothing: a frame has no address bar, so anything it asked the user to
		     type could be impersonated by the embedding page. The password is
		     collected by /vault/unlock, which is a top-level window. -->

		<script>
			(function () {
				// Local AI runtime daemon origin the vault brokers ai-* ops to.
				const DAEMON_URL = {{.DaemonURLJSON}};
				// API origin the vault fetches directly for E2EE collection sync.
				const API_URL = {{.APIURLJSON}};

				let b64;
				let parentOrigin = null;
				let email = null;
				// The embedding client's access token, captured at vault-init. Used to
				// authenticate the vault's brokered fetch to the AI daemon. Never posted
				// back to the app.
				let accessToken = null;

				// Account keypair derived from the AMK on unlock (X25519). The private
				// key stays in this page only; the public key is published so others can
				// seal media DEKs to it. Per-object DEKs are unsealed on demand.
				let myPubKey = null;
				let myPrivKey = null;
				const KEYPAIR_CONTEXT = 'nw-account-keypair-v1';
				// Root secret for chat (Double Ratchet) device identities, kept keyed by
				// the AMK so per-device identity keys are deterministically reproducible
				// after recovery without ever storing a private key on the server.
				let chatRootKey = null;
				// Symmetric key that seals per-session ratchet state at rest. The app
				// persists only the sealed blob; the server never sees ratchet state.
				let chatStateKey = null;
				let ratchet = null;
				const CHAT_IDENTITY_CONTEXT = 'nw-chat-identity-v1';
				const CHAT_STATE_CONTEXT = 'nw-chat-ratchet-state-v1';
				// Cache AES-GCM keys by their wrapped-DEK string so multi-chunk objects
				// don't re-unseal/re-import the DEK for every chunk.
				const dekCache = new Map();

				// ── Scope-bound keys ───────────────────────────────────────────────
				// Per-scope keypairs are derived from the AMK so decryption capability
				// can be bound to OAuth scopes. scopeMaster is a resident secret (see
				// scope-keys.js) so the literal AMK is still zeroed after unlock; per-
				// scope keypairs derive lazily and cache by label. grantedScopes comes
				// from introspecting the embedding client's access token at vault-init;
				// allowedLabels is the set of encryption labels it may decrypt.
				let scopeKeysApi = null;
				let scopeMaster = null;
				const scopeKeyCache = new Map();
				let grantedScopes = [];
				let allowedLabels = new Set();
				let allowedWriteLabels = new Set();
				const LEGACY_LABEL = 'legacy';
				// Bare user id of the token holder, from introspection — never taken
				// from the embedding app, which could claim to be someone else.
				let ownUserId = null;

				// ── Space keys (E2EE shared spaces) ────────────────────────────────
				// Account-level Ed25519 signing keypair (AMK-derived, same on every
				// device) signs envelopes and wrapped space keys. Unwrapped space keys
				// live in memory only, keyed spaceId:epoch — re-derived each session
				// from the server-stored wrapped copies. Pins (Proton pattern) persist
				// in the vault's own IndexedDB partition.
				let spaceApi = null;
				let spaceSignKp = null;
				const spaceKeyCache = new Map();

				function post(target, msg, transfer) {
					if (!target) return;
					window.parent.postMessage(msg, target, transfer || []);
				}

				// ── IndexedDB: vault's own device keypair (per-partition) ──────────
				function idb() {
					return new Promise((resolve, reject) => {
						const req = indexedDB.open('neoworks-vault', 1);
						req.onupgradeneeded = () => req.result.createObjectStore('kv');
						req.onsuccess = () => resolve(req.result);
						req.onerror = () => reject(req.error);
					});
				}
				async function idbGet(key) {
					const db = await idb();
					return new Promise((resolve, reject) => {
						const tx = db.transaction('kv', 'readonly').objectStore('kv').get(key);
						tx.onsuccess = () => resolve(tx.result ?? null);
						tx.onerror = () => reject(tx.error);
					});
				}
				async function idbSet(key, val) {
					const db = await idb();
					return new Promise((resolve, reject) => {
						const tx = db.transaction('kv', 'readwrite');
						tx.objectStore('kv').put(val, key);
						tx.oncomplete = () => resolve();
						tx.onerror = () => reject(tx.error);
					});
				}

				// ── Crypto ────────────────────────────────────────────────────────
				// Derive the account keypair from the AMK (keyed BLAKE2b → X25519 seed)
				// and publish the public key. The AMK is zeroed afterwards; it is only
				// ever needed to re-derive this keypair.
				async function importAmk(amkBytes) {
					const seed = sodium.crypto_generichash(32, sodium.from_string(KEYPAIR_CONTEXT), amkBytes);
					const keypair = sodium.crypto_box_seed_keypair(seed);
					myPubKey = keypair.publicKey;
					myPrivKey = keypair.privateKey;
					// Derive the chat root before the AMK is zeroed; it stays in memory
					// like myPrivKey and never leaves this page.
					chatRootKey = sodium.crypto_generichash(32, sodium.from_string(CHAT_IDENTITY_CONTEXT), amkBytes);
					chatStateKey = sodium.crypto_generichash(32, sodium.from_string(CHAT_STATE_CONTEXT), amkBytes);
					// Resident scope-derivation secret. Lets us zero the literal AMK now
					// yet still derive per-scope keypairs lazily for the lifetime of the
					// session (no more sensitive than myPrivKey, which is already resident).
					scopeMaster = scopeKeysApi.deriveScopeMaster(amkBytes);
					// Space signing identity must derive before the AMK is zeroed.
					spaceSignKp = spaceApi.deriveSigningKeypair(amkBytes);
					sodium.memzero(seed);
					sodium.memzero(amkBytes);
					scopeKeyCache.clear();
					spaceKeyCache.clear();
					await publishPublicKey();
					await publishScopeKeys();
				}

				// Resolve the keypair for an encryption label. LEGACY_LABEL maps to the
				// pre-scope account keypair so old objects stay readable.
				function keypairForLabel(label) {
					if (!label || label === LEGACY_LABEL) {
						return { publicKey: myPubKey, privateKey: myPrivKey };
					}
					let kp = scopeKeyCache.get(label);
					if (!kp) {
						kp = scopeKeysApi.scopeKeypair(scopeMaster, label);
						scopeKeyCache.set(label, kp);
					}
					return kp;
				}

				// ── Chat identity & prekeys (X3DH) ─────────────────────────────────
				// Derive this device's long-term chat identity from the chat root salted
				// by the device public key, so each device is a distinct ratchet endpoint
				// yet every key is reproducible from the AMK on the same device.
				function deriveChatIdentity(devicePubKeyB64) {
					const devicePub = sodium.from_base64(devicePubKeyB64, b64);
					const idSeed = sodium.crypto_generichash(32, devicePub, chatRootKey);
					const dhSeed = sodium.crypto_generichash(32, sodium.from_string('dh'), idSeed);
					const signSeed = sodium.crypto_generichash(32, sodium.from_string('sign'), idSeed);
					const identity = sodium.crypto_box_seed_keypair(dhSeed);
					const signing = sodium.crypto_sign_seed_keypair(signSeed);
					sodium.memzero(idSeed);
					sodium.memzero(dhSeed);
					sodium.memzero(signSeed);
					return { identity, signing };
				}

				// Generate a fresh signed prekey + a batch of one-time prekeys. Prekeys are
				// random (not AMK-derived) — they rotate and are consumed once each. Their
				// private halves are persisted in the vault partition so an inbound prekey
				// message can complete X3DH later; only public halves are returned.
				async function generateChatPrekeys(signingPriv, count) {
					let counter = (await idbGet('chat-prekey-counter')) || 0;

					const signedKp = sodium.crypto_box_keypair();
					const signedKeyId = ++counter;
					const signature = sodium.crypto_sign_detached(signedKp.publicKey, signingPriv);

					const stored = (await idbGet('chat-prekey-privs')) || { signed: {}, oneTime: {} };
					stored.signed[signedKeyId] = sodium.to_base64(signedKp.privateKey, b64);

					const oneTimePublic = [];
					for (let i = 0; i < count; i++) {
						const kp = sodium.crypto_box_keypair();
						const keyId = ++counter;
						stored.oneTime[keyId] = sodium.to_base64(kp.privateKey, b64);
						oneTimePublic.push({ key_id: keyId, public_key: sodium.to_base64(kp.publicKey, b64) });
					}

					await idbSet('chat-prekey-privs', stored);
					await idbSet('chat-prekey-counter', counter);

					return {
						signed_prekey: {
							key_id: signedKeyId,
							public_key: sodium.to_base64(signedKp.publicKey, b64),
							signature: sodium.to_base64(signature, b64)
						},
						one_time_prekeys: oneTimePublic
					};
				}

				// Build the full publishable bundle for this device.
				async function initChatIdentity(count) {
					const kp = await idbGet('devkey');
					if (!kp) throw new Error('no device key');
					const { identity, signing } = deriveChatIdentity(kp.pub);
					const prekeys = await generateChatPrekeys(signing.privateKey, count || 100);
					return {
						device_public_key: kp.pub,
						identity_key: sodium.to_base64(identity.publicKey, b64),
						signing_key: sodium.to_base64(signing.publicKey, b64),
						signed_prekey: prekeys.signed_prekey,
						one_time_prekeys: prekeys.one_time_prekeys
					};
				}

				// ── Double Ratchet sessions ────────────────────────────────────────
				function getRatchet() {
					if (!ratchet) {
						if (!window.__createRatchet) throw new Error('ratchet not loaded');
						ratchet = window.__createRatchet(sodium);
					}
					return ratchet;
				}

				// Seal/open session state under the AMK-derived state key. The app stores
				// only the sealed blob; it is useless without the AMK.
				function sealState(state) {
					const plain = sodium.from_string(JSON.stringify(state));
					const nonce = sodium.randombytes_buf(sodium.crypto_secretbox_NONCEBYTES);
					const ct = sodium.crypto_secretbox_easy(plain, nonce, chatStateKey);
					const out = new Uint8Array(nonce.length + ct.length);
					out.set(nonce, 0);
					out.set(ct, nonce.length);
					return sodium.to_base64(out, b64);
				}
				function openState(sealedB64) {
					const raw = sodium.from_base64(sealedB64, b64);
					const nonce = raw.slice(0, sodium.crypto_secretbox_NONCEBYTES);
					const ct = raw.slice(sodium.crypto_secretbox_NONCEBYTES);
					const plain = sodium.crypto_secretbox_open_easy(ct, nonce, chatStateKey);
					if (!plain) throw new Error('cannot open session state');
					return JSON.parse(sodium.to_string(plain));
				}

				async function chatIdentityB64() {
					const kp = await idbGet('devkey');
					if (!kp) throw new Error('no device key');
					const { identity } = deriveChatIdentity(kp.pub);
					return {
						priv: sodium.to_base64(identity.privateKey, b64),
						pub: sodium.to_base64(identity.publicKey, b64)
					};
				}

				// Look up a stored prekey private by id and recompute its public key.
				async function loadPrekeyPriv(kind, keyId) {
					const stored = (await idbGet('chat-prekey-privs')) || { signed: {}, oneTime: {} };
					const privB64 = stored[kind] && stored[kind][keyId];
					if (!privB64) return null;
					const priv = sodium.from_base64(privB64, b64);
					const pub = sodium.crypto_scalarmult_base(priv);
					return { priv: privB64, pub: sodium.to_base64(pub, b64), stored };
				}

				// Establish (initiator side) and return sealed state + the X3DH header the
				// caller attaches to its first message.
				async function chatX3dhInit(bundle) {
					const id = await chatIdentityB64();
					const r = getRatchet();
					const out = r.x3dhInitiator({ identityPriv: id.priv, identityPub: id.pub, bundle });
					return { sealedState: sealState(out.state), x3dh: out.x3dh };
				}

				// Establish (responder side) from an inbound prekey message and decrypt it.
				// The consumed one-time prekey private is dropped so it is never reused.
				async function chatX3dhAccept(message) {
					const x3dh = message.header.x3dh;
					if (!x3dh) throw new Error('not a prekey message');
					const id = await chatIdentityB64();
					const signed = await loadPrekeyPriv('signed', x3dh.spk_id);
					if (!signed) throw new Error('unknown signed prekey');
					let oneTimePriv;
					let stored = signed.stored;
					if (x3dh.otpk_id != null) {
						const otpk = await loadPrekeyPriv('oneTime', x3dh.otpk_id);
						if (otpk) {
							oneTimePriv = otpk.priv;
							stored = otpk.stored;
						}
					}
					const r = getRatchet();
					let state = r.x3dhResponder({
						identityPriv: id.priv,
						signedPrekeyPub: signed.pub,
						signedPrekeyPriv: signed.priv,
						oneTimePrekeyPriv: oneTimePriv,
						remote: { ik: x3dh.ik, ek: x3dh.ek }
					});
					const dec = r.ratchetDecrypt(state, message);
					if (x3dh.otpk_id != null && stored.oneTime) {
						delete stored.oneTime[x3dh.otpk_id];
						await idbSet('chat-prekey-privs', stored);
					}
					return { sealedState: sealState(dec.state), plaintext: sodium.to_base64(dec.plaintext, b64) };
				}

				function chatEncrypt(sealedState, plaintextB64, extra) {
					const r = getRatchet();
					const state = openState(sealedState);
					const out = r.ratchetEncrypt(state, sodium.from_base64(plaintextB64, b64), extra || null);
					return { sealedState: sealState(out.state), message: out.message };
				}

				function chatDecrypt(sealedState, message) {
					const r = getRatchet();
					const state = openState(sealedState);
					const out = r.ratchetDecrypt(state, message);
					return { sealedState: sealState(out.state), plaintext: sodium.to_base64(out.plaintext, b64) };
				}

				// ── Group (Sender Keys) ────────────────────────────────────────────
				// Create this device's sender key for a group; return the sealed sender
				// state and the public distribution to hand to members over 1:1 sessions.
				function chatGroupCreate() {
					const r = getRatchet();
					const state = r.groupSenderCreate();
					return { sealedState: sealState(state), distribution: r.groupSenderDistribution(state) };
				}

				function chatGroupEncrypt(sealedState, plaintextB64) {
					const r = getRatchet();
					const state = openState(sealedState);
					const out = r.groupEncrypt(state, sodium.from_base64(plaintextB64, b64));
					return { sealedState: sealState(out.state), message: out.message };
				}

				// Store a member's sender key (from their distribution) as sealed receiver state.
				function chatGroupAccept(distribution) {
					const r = getRatchet();
					const state = r.groupReceiverFromDistribution(distribution);
					return { sealedState: sealState(state) };
				}

				function chatGroupDecrypt(sealedState, message) {
					const r = getRatchet();
					const state = openState(sealedState);
					const out = r.groupDecrypt(state, message);
					return { sealedState: sealState(out.state), plaintext: sodium.to_base64(out.plaintext, b64) };
				}

				// Best-effort: publish the derived public key so senders can seal DEKs
				// to this account. Non-fatal if it fails — encrypt/decrypt still work.
				// The key directory lives on the API origin, so these go out with the
				// embedding client's bearer token — a relative path would hit the oauth
				// origin, and cookies can't ride a wildcard-CORS request anyway.
				function apiFetch(path, init) {
					const options = init || {};
					const headers = Object.assign({}, options.headers);
					if (accessToken) headers.Authorization = 'Bearer ' + accessToken;
					return fetch(API_URL + path, Object.assign({}, options, { headers }));
				}

				async function publishPublicKey() {
					try {
						const pub = sodium.to_base64(myPubKey, b64);
						const fingerprint = sodium.to_base64(sodium.crypto_generichash(32, myPubKey), b64);
						const signPub = spaceSignKp ? sodium.to_base64(spaceSignKp.publicKey, b64) : '';
						await apiFetch('/api/v1/keys/public', {
							method: 'PUT',
							headers: { 'Content-Type': 'application/json' },
							body: JSON.stringify({ public_key: pub, fingerprint, sign_public_key: signPub })
						});
					} catch (_) {
						// ignore — directory publish is not required for local crypto
					}
				}

				// Publish each granted scope's public key to the directory so writers
				// (this account's other apps, or other users sharing in) can seal DEKs to
				// the right scope without ever holding a private key. Best-effort.
				async function publishScopeKeys() {
					for (const label of allowedLabels) {
						if (label === LEGACY_LABEL) continue;
						try {
							const kp = keypairForLabel(label);
							await apiFetch('/api/v1/keys/scope-public', {
								method: 'PUT',
								headers: { 'Content-Type': 'application/json' },
								body: JSON.stringify({ scope: label, public_key: sodium.to_base64(kp.publicKey, b64) })
							});
						} catch (_) {
							// ignore — directory publish is not required for local crypto
						}
					}
				}

				// How often the granted scopes are re-checked against the server. The
				// capability this frame holds outlives no grant: a revoked or narrowed
				// token stops decrypting within one interval rather than at reload.
				const REVALIDATE_INTERVAL_MS = 120000;
				let revalidateTimer = null;

				// Ask the server what a token currently carries. Returns the parsed
				// introspection body, or null when the answer could not be obtained —
				// which callers must distinguish from an answer of "inactive".
				async function fetchIntrospection(token) {
					if (!token) return null;
					try {
						// The endpoint is client-authenticated: self-introspection, so the
						// same token both authenticates the call and is its subject.
						const res = await fetch('/oauth/introspect', {
							method: 'POST',
							credentials: 'include',
							headers: {
								'Content-Type': 'application/x-www-form-urlencoded',
								Authorization: 'Bearer ' + token
							},
							body: 'token=' + encodeURIComponent(token)
						});
						if (!res.ok) return null;
						return await res.json();
					} catch (_) {
						return null;
					}
				}

				// Drop every capability. Cached scope keypairs go too: they are derived
				// material for scopes this caller no longer holds.
				function clearCapability() {
					grantedScopes = [];
					allowedLabels = new Set();
					allowedWriteLabels = new Set();
					ownUserId = null;
					scopeKeyCache.clear();
				}

				function applyCapability(body) {
					grantedScopes = String(body.scope || '').split(' ').filter(Boolean);
					allowedLabels = window.__decryptableLabels(grantedScopes);
					allowedWriteLabels = window.__writableLabels(grantedScopes);
					ownUserId = body.sub ? String(body.sub) : null;
					pruneScopeKeyCache();
				}

				// Hygiene, not a gate: scopeMaster can re-derive any of these on demand,
				// so this only keeps keypairs for revoked labels from sitting resident.
				// Decryption is refused by allowedLabels, not by a cache miss.
				function pruneScopeKeyCache() {
					for (const label of scopeKeyCache.keys()) {
						if (allowedLabels.has(label)) continue;
						scopeKeyCache.delete(label);
					}
				}

				// Resolve the embedding client's granted scopes by introspecting its
				// access token (same-origin, first-party). The resulting allowedLabels
				// is the ONLY thing that lets a caller decrypt a scope — an unknown or
				// inactive token leaves it empty, so the Vault decrypts nothing.
				//
				// Fail-closed: used when adopting a token, where no answer means no
				// capability.
				async function introspectScopes(token) {
					clearCapability();
					const body = await fetchIntrospection(token);
					if (!body) return;
					if (!body.active) return;
					applyCapability(body);
				}

				// The periodic re-check. Unlike adopting a token, an unreachable server
				// leaves the current capability standing until the next tick — the token
				// still carries its own expiry, and dropping a working session on a
				// network blip trades a real failure for a hypothetical one. A definite
				// "inactive" revokes immediately.
				async function revalidateCapability() {
					if (!accessToken) return;
					const body = await fetchIntrospection(accessToken);
					if (!body) return;
					if (!body.active) {
						clearCapability();
						return;
					}
					applyCapability(body);
				}

				function startRevalidating() {
					if (revalidateTimer) return;
					revalidateTimer = setInterval(revalidateCapability, REVALIDATE_INTERVAL_MS);
				}

				function sealDek(dekBytes, pubKeyBytes) {
					return sodium.to_base64(sodium.crypto_box_seal(dekBytes, pubKeyBytes), b64);
				}
				function openDek(wrappedB64, kp) {
					return sodium.crypto_box_seal_open(sodium.from_base64(wrappedB64, b64), kp.publicKey, kp.privateKey);
				}
				function aesKeyFromDek(dekBytes) {
					return crypto.subtle.importKey('raw', dekBytes, 'AES-GCM', false, ['encrypt', 'decrypt']);
				}
				async function aesKeyForWrapped(wrappedB64, kp) {
					const cached = dekCache.get(wrappedB64);
					if (cached) return cached;
					const dek = openDek(wrappedB64, kp);
					if (!dek) throw new Error('cannot unseal key');
					const key = await aesKeyFromDek(dek);
					sodium.memzero(dek);
					dekCache.set(wrappedB64, key);
					return key;
				}

				// Encrypt a chunk under the given scope. With no wrappedDEK, mint a fresh
				// per-object DEK sealed to the scope's pubkey and return it so later
				// chunks reuse the same DEK.
				async function encryptBytes(plain, wrappedDEK, label) {
					const kp = keypairForLabel(label);
					let wrapped = wrappedDEK || null;
					let key;
					if (wrapped) {
						key = await aesKeyForWrapped(wrapped, kp);
					} else {
						const dek = crypto.getRandomValues(new Uint8Array(32));
						wrapped = sealDek(dek, kp.publicKey);
						key = await aesKeyFromDek(dek);
						sodium.memzero(dek);
						dekCache.set(wrapped, key);
					}
					const iv = crypto.getRandomValues(new Uint8Array(12));
					const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, plain));
					const out = new Uint8Array(12 + ct.length);
					out.set(iv, 0);
					out.set(ct, 12);
					return { ciphertext: out, wrappedDEK: wrapped };
				}
				async function decryptBytes(enc, wrappedDEK, label) {
					const key = await aesKeyForWrapped(wrappedDEK, keypairForLabel(label));
					const iv = enc.slice(0, 12);
					const ct = enc.slice(12);
					return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
				}

				// Re-seal an object's DEK to another user's public key (sharing). The DEK
				// plaintext is unsealed (with the owner's scope key) and re-sealed
				// entirely inside this page.
				function rewrapDek(wrappedDEK, recipientPubKeyB64, label) {
					const dek = openDek(wrappedDEK, keypairForLabel(label));
					if (!dek) throw new Error('cannot unseal key');
					const recipientPub = sodium.from_base64(recipientPubKeyB64, b64);
					const out = sealDek(dek, recipientPub);
					sodium.memzero(dek);
					return out;
				}

				// ── Space ops ───────────────────────────────────────────────────────
				// Unwrapped space keys are cached in memory only, keyed spaceId:epoch.
				function spaceCacheKey(spaceId, epoch) {
					return spaceId + ':' + epoch;
				}
				function cachedSpaceKey(spaceId, epoch) {
					const key = spaceKeyCache.get(spaceCacheKey(spaceId, epoch));
					if (!key) throw new Error('space key not unlocked (epoch ' + epoch + ')');
					return key;
				}

				// Pin bookkeeping (Proton pattern): first sight of a space key epoch or
				// an author signer key pins it; any later mismatch is a hard error the
				// app must surface — it means the server or inviter swapped keys.
				async function checkSpacePin(spaceId, epoch, fingerprint, signerPub) {
					const pinKey = 'space-pin:' + spaceId + ':' + epoch;
					const pinned = await idbGet(pinKey);
					if (!pinned) {
						await idbSet(pinKey, { fingerprint, signerPub });
						return;
					}
					if (pinned.fingerprint !== fingerprint) throw new Error('space key pin mismatch');
					if (pinned.signerPub !== signerPub) throw new Error('space signer pin mismatch');
				}
				async function checkAuthorPin(userId, signerPub) {
					if (!userId) return;
					const pinKey = 'author-pin:' + userId;
					const pinned = await idbGet(pinKey);
					if (!pinned) {
						await idbSet(pinKey, signerPub);
						return;
					}
					if (pinned !== signerPub) throw new Error('author signer pin mismatch');
				}

				// Mint a space key (epoch 1), self-wrap to the collection scope key.
				async function spaceKeyCreate(msg) {
					const kp = keypairForLabel(msg.collection);
					const spaceKey = spaceApi.mintSpaceKey();
					const wrappedKey = spaceApi.wrapSpaceKey(spaceKey, sodium.to_base64(kp.publicKey, b64));
					const signature = spaceApi.signWrap(msg.spaceId, msg.userId, 1, spaceKey, spaceSignKp.privateKey);
					const fingerprint = spaceApi.keyFingerprint(spaceKey);
					const signerPub = sodium.to_base64(spaceSignKp.publicKey, b64);
					spaceKeyCache.set(spaceCacheKey(msg.spaceId, 1), spaceKey);
					await checkSpacePin(msg.spaceId, 1, fingerprint, signerPub);
					return { wrappedKey, keyEpoch: 1, signature, signerPub, keyFingerprint: fingerprint };
				}

				// Unseal a membership wrap, verify the inviter's signature, pin, and
				// re-sign with our own key (the accept pin the server stores).
				async function spaceKeyUnwrap(msg) {
					const kp = keypairForLabel(msg.collection);
					const spaceKey = spaceApi.unwrapSpaceKey(msg.wrappedKey, kp);
					if (!spaceApi.verifyWrap(msg.spaceId, msg.userId, msg.keyEpoch, spaceKey, msg.signature, msg.signerPub)) {
						throw new Error('bad space key signature');
					}
					const fingerprint = spaceApi.keyFingerprint(spaceKey);
					await checkSpacePin(msg.spaceId, msg.keyEpoch, fingerprint, msg.signerPub);
					if (msg.inviterUserId) await checkAuthorPin(msg.inviterUserId, msg.signerPub);
					spaceKeyCache.set(spaceCacheKey(msg.spaceId, msg.keyEpoch), spaceKey);
					const mySignature = spaceApi.signWrap(msg.spaceId, msg.userId, msg.keyEpoch, spaceKey, spaceSignKp.privateKey);
					return {
						keyFingerprint: fingerprint,
						mySignature,
						mySignerPub: sodium.to_base64(spaceSignKp.publicKey, b64)
					};
				}

				// Wrap an already-unlocked epoch key to another member (invite).
				function spaceKeyWrap(msg) {
					const spaceKey = cachedSpaceKey(msg.spaceId, msg.keyEpoch);
					return {
						wrappedKey: spaceApi.wrapSpaceKey(spaceKey, msg.recipientPubKey),
						signature: spaceApi.signWrap(msg.spaceId, msg.memberUserId, msg.keyEpoch, spaceKey, spaceSignKp.privateKey),
						signerPub: sodium.to_base64(spaceSignKp.publicKey, b64)
					};
				}

				// Mint the next epoch's key and wrap it for every remaining member.
				async function spaceKeyRotate(msg) {
					const spaceKey = spaceApi.mintSpaceKey();
					const fingerprint = spaceApi.keyFingerprint(spaceKey);
					const signerPub = sodium.to_base64(spaceSignKp.publicKey, b64);
					const wraps = [];
					for (const recipient of msg.recipients) {
						wraps.push({
							userId: recipient.userId,
							wrappedKey: spaceApi.wrapSpaceKey(spaceKey, recipient.pubKey),
							signature: spaceApi.signWrap(msg.spaceId, recipient.userId, msg.newEpoch, spaceKey, spaceSignKp.privateKey)
						});
					}
					spaceKeyCache.set(spaceCacheKey(msg.spaceId, msg.newEpoch), spaceKey);
					await checkSpacePin(msg.spaceId, msg.newEpoch, fingerprint, signerPub);
					return { wraps, signerPub, keyFingerprint: fingerprint };
				}

				// Re-verify every membership wrap against stored pins (call at start).
				async function spacePinsVerify(msg) {
					const results = [];
					for (const entry of msg.spaces) {
						try {
							await spaceKeyUnwrap({ ...entry, collection: msg.collection });
							results.push({ spaceId: entry.spaceId, keyEpoch: entry.keyEpoch, ok: true });
						} catch (err) {
							results.push({
								spaceId: entry.spaceId,
								keyEpoch: entry.keyEpoch,
								ok: false,
								error: String(err && err.message)
							});
						}
					}
					return { results };
				}

				// A history entry carries versionId and derives its own key and AAD;
				// everything else is a row of the collection itself.
				async function envelopeAesKey(spaceId, item) {
					const spaceKey = cachedSpaceKey(spaceId, item.keyEpoch);
					let derived = spaceApi.deriveRowKey(spaceKey, item.itemId);
					if (item.versionId) {
						derived = spaceApi.deriveVersionKey(spaceKey, item.versionId);
					}
					const key = await aesKeyFromDek(derived);
					sodium.memzero(derived);
					return key;
				}

				function rowHeader(spaceId, item) {
					return {
						versionId: item.versionId,
						itemId: item.itemId,
						spaceId,
						collection: item.collection,
						keyEpoch: item.keyEpoch,
						schemaVer: item.schemaVer,
						baseSeq: item.baseSeq,
						deleted: !!item.deleted
					};
				}

				function envelopeAad(spaceId, collection, item) {
					const header = rowHeader(spaceId, { ...item, collection });
					if (header.versionId) return spaceApi.buildVersionAad(header);
					return spaceApi.buildRowAad(header);
				}

				// Encrypt one row: AES-GCM(iv‖ct) under the per-row key, AAD-bound
				// header, Ed25519 envelope signature. Tombstones sign an empty blob.
				async function spaceEncryptOne(spaceId, collection, item, plainBytes) {
					const aad = envelopeAad(spaceId, collection, item);
					let blob = new Uint8Array(0);
					if (!item.deleted) {
						const key = await envelopeAesKey(spaceId, item);
						const iv = crypto.getRandomValues(new Uint8Array(12));
						const ct = new Uint8Array(
							await crypto.subtle.encrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, plainBytes)
						);
						blob = new Uint8Array(12 + ct.length);
						blob.set(iv, 0);
						blob.set(ct, 12);
					}
					const sig = spaceApi.signEnvelope(aad, blob, spaceSignKp.privateKey);
					return { blob, sig, signerPub: sodium.to_base64(spaceSignKp.publicKey, b64) };
				}

				// Decrypt one row: verify author signature (pinned per user), then
				// AES-GCM open with the AAD — any header tamper fails the open.
				async function spaceDecryptOne(spaceId, collection, item, blobBytes) {
					const aad = envelopeAad(spaceId, collection, item);
					if (!spaceApi.verifyEnvelope(aad, blobBytes, item.sig, item.signerPub)) {
						throw new Error('bad envelope signature');
					}
					await checkAuthorPin(item.authorUserId, item.signerPub);
					if (item.deleted) return new Uint8Array(0);
					const key = await envelopeAesKey(spaceId, item);
					const iv = blobBytes.slice(0, 12);
					const ct = blobBytes.slice(12);
					return new Uint8Array(
						await crypto.subtle.decrypt({ name: 'AES-GCM', iv, additionalData: aad }, key, ct)
					);
				}

				// Batch forms: one concatenated buffer + per-item offsets, so a 500-row
				// sync page costs one postMessage round-trip, not 500.
				async function spaceEncryptBatch(msg) {
					const data = new Uint8Array(msg.data);
					const parts = [];
					let total = 0;
					for (const item of msg.items) {
						const plain = data.slice(item.offset, item.offset + item.length);
						const part = await spaceEncryptOne(msg.spaceId, msg.collection, item, plain);
						parts.push({ item, part });
						total += part.blob.length;
					}
					const out = new Uint8Array(total);
					const results = [];
					let cursor = 0;
					for (const { item, part } of parts) {
						out.set(part.blob, cursor);
						results.push({
							itemId: item.itemId,
							offset: cursor,
							length: part.blob.length,
							sig: part.sig,
							signerPub: part.signerPub
						});
						cursor += part.blob.length;
					}
					return { results, buffer: out.buffer };
				}

				async function spaceDecryptBatch(msg) {
					const data = new Uint8Array(msg.data);
					const parts = [];
					let total = 0;
					for (const item of msg.items) {
						const blob = data.slice(item.offset, item.offset + item.length);
						try {
							const plain = await spaceDecryptOne(msg.spaceId, msg.collection, item, blob);
							parts.push({ item, plain, error: null });
							total += plain.length;
						} catch (err) {
							parts.push({ item, plain: null, error: String(err && err.message) });
						}
					}
					const out = new Uint8Array(total);
					const results = [];
					let cursor = 0;
					for (const { item, plain, error } of parts) {
						if (error) {
							results.push({ itemId: item.itemId, error });
							continue;
						}
						out.set(plain, cursor);
						results.push({ itemId: item.itemId, offset: cursor, length: plain.length });
						cursor += plain.length;
					}
					return { results, buffer: out.buffer };
				}

				// ── Unlock paths ────────────────────────────────────────────────────
				async function fetchWrappedAmk(publicKeyB64) {
					const res = await apiFetch(
						'/api/v1/keys/devices/me?public_key=' + encodeURIComponent(publicKeyB64)
					);
					if (!res.ok) return null;
					const body = await res.json();
					return body.wrapped_amk || null;
				}

				async function unlockWithStoredKeypair() {
					const kp = await idbGet('devkey');
					if (!kp) return false;
					const wrapped = await fetchWrappedAmk(kp.pub);
					if (!wrapped) return false;
					const amk = sodium.crypto_box_seal_open(
						sodium.from_base64(wrapped, b64),
						sodium.from_base64(kp.pub, b64),
						sodium.from_base64(kp.priv, b64)
					);
					await importAmk(amk);
					return true;
				}

				// This frame's own keypair, kept in its own (partitioned) IndexedDB.
				// The unlock window seals the account key to the public half, so the
				// key reaches this origin without the embedding app ever holding it and
				// without the two windows needing to share a storage partition.
				async function ensureDeviceKey() {
					const existing = await idbGet('devkey');
					if (existing) return existing;
					const keypair = sodium.crypto_box_keypair();
					const created = {
						pub: sodium.to_base64(keypair.publicKey, b64),
						priv: sodium.to_base64(keypair.privateKey, b64)
					};
					await idbSet('devkey', created);
					return created;
				}

				function ready() {
					post(parentOrigin, { type: 'ready' });
				}

				// Locked: hand the app this frame's PUBLIC key so the unlock window can
				// seal the account key to it. The app can do nothing else with it.
				async function postLocked() {
					const devkey = await ensureDeviceKey();
					post(parentOrigin, { type: 'locked', devicePublicKey: devkey.pub });
				}

				async function trySilentUnlock() {
					try {
						return await unlockWithStoredKeypair();
					} catch {
						return false;
					}
				}

				// ── Collection stores (live in this origin, never in the app) ───────
				// The decrypted rows, their IndexedDB partitions and the query engine
				// belong to the vault. Apps only send scope-checked ops; even the sync
				// fetches to the API happen here, so ciphertext and plaintext alike
				// stay out of the embedding page.
				let collectionStore = null;
				const tokenWaiters = new Map();
				let nextTokenRequestId = 1;

				// The vault holds the app's access token but not its refresh token, so
				// a 401 on the sync path is answered by asking the embedder to refresh.
				//
				// The replacement is re-introspected before it is used: a refresh may
				// come back with fewer scopes, or for a different subject, and adopting
				// it without re-resolving would leave this frame decrypting under the
				// capability the previous token granted.
				function requestFreshToken() {
					if (!parentOrigin) return Promise.resolve(null);
					const id = nextTokenRequestId++;
					return new Promise((resolve) => {
						const timer = setTimeout(() => {
							tokenWaiters.delete(id);
							resolve(null);
						}, 15000);
						tokenWaiters.set(id, async (token) => {
							clearTimeout(timer);
							accessToken = token;
							const previousUserId = ownUserId;
							await introspectScopes(token);
							// A different subject must not keep writing through a store
							// bound to the previous holder's id.
							if (ownUserId !== previousUserId) collectionStore = null;
							resolve(token);
						});
						post(parentOrigin, { type: 'vault-token-request', id });
					});
				}

				// In-process crypto for the stores: the same space operations the app
				// reaches over postMessage, called directly with resident keys.
				function collectionCrypto() {
					return {
						spaceKeyCreate: (collection, spaceId, userId) =>
							spaceKeyCreate({ collection, spaceId, userId }),
						spaceKeyUnwrap: (collection, spaceId, wrap) =>
							spaceKeyUnwrap({ collection, spaceId, ...wrap }),
						spaceEncrypt: (collection, spaceId, header, plaintext) =>
							spaceEncryptOne(spaceId, collection, header, plaintext),
						spaceDecryptBatch: async (collection, spaceId, rows) => {
							const out = [];
							for (const row of rows) {
								try {
									out.push({ plaintext: await spaceDecryptOne(spaceId, collection, row.header, row.blob) });
								} catch (err) {
									out.push({ error: String(err && err.message) });
								}
							}
							return out;
						}
					};
				}

				// Brokered embedding for the collection stores. Returns null (rather than
				// throwing) whenever the scope is missing or the daemon is unreachable,
				// so a store that cannot embed degrades to lexical search instead of
				// failing the write that triggered it.
				async function embedText(input) {
					const res = await fetch(DAEMON_URL + '/v1/embed', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json',
							Authorization: 'Bearer ' + (accessToken || '')
						},
						body: JSON.stringify({ input })
					});
					if (!res.ok) throw new Error('daemon_status_' + res.status);
					return res.json();
				}

				async function embedOne(text) {
					if (!grantedScopes.includes('ai:embed')) return null;
					if (!text) return null;
					try {
						const result = await embedText([text]);
						const vector = result.vectors && result.vectors[0];
						if (!vector) return null;
						return { model: result.model, dim: result.dim, vector: vector };
					} catch (_) {
						return null;
					}
				}

				function collectionStores() {
					// The stores bind the token holder's id (envelope authorship); without
					// a verified subject there is nobody to write as.
					if (!ownUserId) throw new Error('no verified user for this token');
					if (!collectionStore) {
						collectionStore = window.__createVaultStore({
							apiUrl: API_URL,
							ownUserId: ownUserId,
							crypto: collectionCrypto(),
							getToken: () => accessToken,
							refreshToken: requestFreshToken,
							embed: embedOne,
							emit: (collection, event, detail) =>
								post(parentOrigin, { type: 'collection-event', collection, event, detail })
						});
					}
					return collectionStore;
				}

				// Capability gate for a collection op: reads need a read-implying grant
				// for the collection's label, writes a write-implying one. The label IS
				// the collection name, so an ungranted collection is unreachable rather
				// than merely filtered.
				function collectionOpAllowed(op) {
					if (!allowedLabels.has(op.collection)) return false;
					if (!window.__opNeedsWrite(op.verb)) return true;
					return allowedWriteLabels.has(op.collection);
				}

				// ── Message bridge ──────────────────────────────────────────────────
				// Open to any origin. What a caller may decrypt is decided by the
				// access token it inits with — introspected against this server, and
				// binding to keypairs derived per granted scope — so an origin filter
				// would grant nothing extra and only duplicate that gate. Storage is
				// partitioned per embedder, so a page that frames this one reaches its
				// own empty partition, not another app's keys.
				window.addEventListener('message', async (e) => {
					const msg = e.data || {};

					await sodium.ready;
					if (!b64) b64 = sodium.base64_variants.ORIGINAL;

					// Asked before sign-in, while there is no token to init with: the
					// app needs this frame's public key so the login window can seal
					// the account key to it.
					if (msg.type === 'vault-device-key-request') {
						parentOrigin = e.origin;
						const devkey = await ensureDeviceKey();
						post(parentOrigin, { type: 'vault-device-key', devicePublicKey: devkey.pub });
						return;
					}

					if (msg.type === 'vault-init') {
						parentOrigin = e.origin;
						email = msg.email || null;
						accessToken = msg.token || null;
						// A fresh init may carry a different subject or scope set; drop the
						// stores so they rebind instead of writing as the previous holder.
						collectionStore = null;
						// Bind this session's decryption capability to the embedding
						// client's granted OAuth scopes (from its access token). Done
						// before unlock so publishScopeKeys covers the granted labels.
						await introspectScopes(msg.token);
						startRevalidating();
						if (await trySilentUnlock()) {
							ready();
						} else {
							await postLocked();
						}
						return;
					}

					// The unlock window finished; the account key is now waiting on the
					// server, sealed to this frame's device key.
					if (msg.type === 'vault-retry-unlock') {
						if (await trySilentUnlock()) {
							ready();
						} else {
							await postLocked();
						}
						return;
					}

					if (msg.type === 'chat-init-identity') {
						if (!chatRootKey) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'locked' }, e.origin);
							return;
						}
						try {
							const bundle = await initChatIdentity(msg.count);
							e.source.postMessage({ type: 'result', id: msg.id, ok: true, bundle }, e.origin);
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
						return;
					}

					if (msg.type && msg.type.indexOf('chat-') === 0 && msg.type !== 'chat-init-identity') {
						if (!chatStateKey) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'locked' }, e.origin);
							return;
						}
						try {
							let result;
							if (msg.type === 'chat-x3dh-init') {
								result = await chatX3dhInit(msg.bundle);
							} else if (msg.type === 'chat-x3dh-accept') {
								result = await chatX3dhAccept(msg.message);
							} else if (msg.type === 'chat-encrypt') {
								result = chatEncrypt(msg.sealedState, msg.plaintext, msg.x3dh);
							} else if (msg.type === 'chat-decrypt') {
								result = chatDecrypt(msg.sealedState, msg.message);
							} else if (msg.type === 'chat-group-create') {
								result = chatGroupCreate();
							} else if (msg.type === 'chat-group-encrypt') {
								result = chatGroupEncrypt(msg.sealedState, msg.plaintext);
							} else if (msg.type === 'chat-group-accept') {
								result = chatGroupAccept(msg.distribution);
							} else if (msg.type === 'chat-group-decrypt') {
								result = chatGroupDecrypt(msg.sealedState, msg.message);
							} else {
								throw new Error('unknown chat op');
							}
							e.source.postMessage({ type: 'result', id: msg.id, ok: true, ...result }, e.origin);
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
						return;
					}

					if (msg.type === 'ai-embed') {
						// Embedding is not a stream and never leaves the machine: the
						// daemon runs the model locally so encrypted content can be ranked
						// on device. Gated on the exact scope, like the other ai-* ops.
						if (!grantedScopes.includes('ai:embed')) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'scope_not_granted' }, e.origin);
							return;
						}
						try {
							const result = await embedText(msg.input || []);
							e.source.postMessage({ type: 'result', id: msg.id, ok: true, ...result }, e.origin);
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
						return;
					}

					if (msg.type === 'ai-complete' || msg.type === 'ai-chat') {
						// AI ops need no AMK — only the granted ai:* scope. Gate on the
						// exact scope string (not the crypto-label path), then broker the
						// request to the local daemon and stream deltas back.
						const scope = msg.type === 'ai-chat' ? 'ai:chat' : 'ai:complete';
						if (!grantedScopes.includes(scope)) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'scope_not_granted' }, e.origin);
							return;
						}
						const path = msg.type === 'ai-chat' ? '/v1/chat' : '/v1/complete';

						// Sealed persistence: when the app opts into a session, the prior
						// history is stored only as an opaque blob sealed under chatStateKey.
						// The Vault unseals it, prepends it to the new turn for the daemon,
						// and re-seals the extended history — the app never sees plaintext.
						const payload = msg.payload || {};
						const wantsSession = msg.type === 'ai-chat' && payload.persist === true;
						if (wantsSession && !chatStateKey) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'locked' }, e.origin);
							return;
						}
						let requestBody = payload;
						if (wantsSession) {
							let priorMessages = [];
							if (payload.session) {
								try {
									priorMessages = openState(payload.session);
								} catch (_) {
									e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'bad_session' }, e.origin);
									return;
								}
							}
							const incoming = Array.isArray(payload.messages) ? payload.messages : [];
							requestBody = { model: payload.model, messages: priorMessages.concat(incoming), tools: payload.tools };
						}
						try {
							const res = await fetch(DAEMON_URL + path, {
								method: 'POST',
								headers: {
									'Content-Type': 'application/json',
									Authorization: 'Bearer ' + (accessToken || '')
								},
								body: JSON.stringify(requestBody)
							});
							if (!res.ok || !res.body) {
								e.source.postMessage(
									{ type: 'result', id: msg.id, ok: false, error: 'daemon_status_' + res.status },
									e.origin
								);
								return;
							}
							const reader = res.body.getReader();
							const decoder = new TextDecoder();
							let sseBuffer = '';
							// Reconstruct the assistant turn from the deltas we forward, so a
							// sealed session can be re-sealed without the daemon echoing history.
							let assistantText = '';
							for (;;) {
								const { value, done } = await reader.read();
								if (done) break;
								sseBuffer += decoder.decode(value, { stream: true });
								let sep;
								while ((sep = sseBuffer.indexOf('\n\n')) !== -1) {
									const frame = sseBuffer.slice(0, sep).trim();
									sseBuffer = sseBuffer.slice(sep + 2);
									if (!frame.startsWith('data:')) continue;
									const data = frame.slice(5).trim();
									if (data === '[DONE]') continue;
									let parsed;
									try {
										parsed = JSON.parse(data);
									} catch (_) {
										continue;
									}
									if (parsed.delta) {
										assistantText += parsed.delta;
										e.source.postMessage({ type: 'ai-chunk', id: msg.id, delta: parsed.delta }, e.origin);
									} else if (parsed.error) {
										e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: parsed.error }, e.origin);
										return;
									}
								}
							}
							const result = { type: 'result', id: msg.id, ok: true, done: true };
							if (wantsSession) {
								const fullHistory = requestBody.messages.concat([{ role: 'assistant', content: assistantText }]);
								result.session = sealState(fullHistory);
							}
							e.source.postMessage(result, e.origin);
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
						return;
					}

					if (msg.type === 'vault-token') {
						const waiter = tokenWaiters.get(msg.id);
						if (waiter) {
							tokenWaiters.delete(msg.id);
							waiter(msg.token || null);
						}
						return;
					}

					const collectionOp = msg.type ? window.__parseOp(msg.type) : null;
					if (collectionOp && window.__collectionNames().includes(collectionOp.collection)) {
						// Space keys must be resident: the store decrypts on every read
						// path, so a locked vault can answer nothing.
						if (!spaceSignKp) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'locked' }, e.origin);
							return;
						}
						if (!collectionOpAllowed(collectionOp)) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'scope_not_granted' }, e.origin);
							return;
						}
						try {
							const result = await collectionStores().handle(msg);
							e.source.postMessage({ type: 'result', id: msg.id, ok: true, ...result }, e.origin);
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
						return;
					}

					if (msg.type && msg.type.indexOf('space-') === 0) {
						if (!spaceSignKp) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'locked' }, e.origin);
							return;
						}
						// Capability gate: the collection is the encryption label. A caller
						// whose token lacks a read grant for it gets nothing, and one
						// without a write grant cannot produce envelopes or space keys.
						if (!window.__spaceOpAllowed(msg.type, msg.collection, allowedLabels, allowedWriteLabels)) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'scope_not_granted' }, e.origin);
							return;
						}
						try {
							if (msg.type === 'space-encrypt-batch') {
								const out = await spaceEncryptBatch(msg);
								e.source.postMessage(
									{ type: 'result', id: msg.id, ok: true, items: out.results, data: out.buffer },
									e.origin,
									[out.buffer]
								);
								return;
							}
							if (msg.type === 'space-decrypt-batch') {
								const out = await spaceDecryptBatch(msg);
								e.source.postMessage(
									{ type: 'result', id: msg.id, ok: true, items: out.results, data: out.buffer },
									e.origin,
									[out.buffer]
								);
								return;
							}
							let result;
							if (msg.type === 'space-key-create') {
								result = await spaceKeyCreate(msg);
							} else if (msg.type === 'space-key-unwrap') {
								result = await spaceKeyUnwrap(msg);
							} else if (msg.type === 'space-key-wrap') {
								result = spaceKeyWrap(msg);
							} else if (msg.type === 'space-key-rotate') {
								result = await spaceKeyRotate(msg);
							} else if (msg.type === 'space-pins-verify') {
								result = await spacePinsVerify(msg);
							} else if (msg.type === 'space-encrypt') {
								const part = await spaceEncryptOne(msg.spaceId, msg.collection, msg, new Uint8Array(msg.data));
								const buf = part.blob.buffer;
								e.source.postMessage(
									{ type: 'result', id: msg.id, ok: true, data: buf, sig: part.sig, signerPub: part.signerPub },
									e.origin,
									[buf]
								);
								return;
							} else if (msg.type === 'space-decrypt') {
								const plain = await spaceDecryptOne(msg.spaceId, msg.collection, msg, new Uint8Array(msg.data));
								const buf = plain.buffer;
								e.source.postMessage({ type: 'result', id: msg.id, ok: true, data: buf }, e.origin, [buf]);
								return;
							} else {
								throw new Error('unknown space op');
							}
							e.source.postMessage({ type: 'result', id: msg.id, ok: true, ...result }, e.origin);
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
						return;
					}

					if (msg.type === 'encrypt' || msg.type === 'decrypt' || msg.type === 'rewrap') {
						if (!myPrivKey) {
							e.source.postMessage({ type: 'result', id: msg.id, ok: false, error: 'locked' }, e.origin);
							return;
						}
						// Bind the operation to a scope the embedding client was granted.
						// LEGACY_LABEL (pre-migration objects) is itself a label gated by a
						// `legacy:read` grant, so untrusted clients can't read old data.
						const label = msg.scope || LEGACY_LABEL;
						if (!allowedLabels.has(label)) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: 'scope_not_granted' },
								e.origin
							);
							return;
						}
						try {
							if (msg.type === 'rewrap') {
								const wrapped = rewrapDek(msg.wrappedDEK, msg.recipientPubKey, label);
								e.source.postMessage({ type: 'result', id: msg.id, ok: true, wrappedDEK: wrapped }, e.origin);
								return;
							}
							const data = new Uint8Array(msg.data);
							if (msg.type === 'encrypt') {
								const res = await encryptBytes(data, msg.wrappedDEK || null, label);
								const buf = res.ciphertext.buffer;
								e.source.postMessage(
									{ type: 'result', id: msg.id, ok: true, data: buf, wrappedDEK: res.wrappedDEK },
									e.origin,
									[buf]
								);
							} else {
								const out = await decryptBytes(data, msg.wrappedDEK, label);
								const buf = out.buffer;
								e.source.postMessage({ type: 'result', id: msg.id, ok: true, data: buf }, e.origin, [buf]);
							}
						} catch (err) {
							e.source.postMessage(
								{ type: 'result', id: msg.id, ok: false, error: String(err && err.message) },
								e.origin
							);
						}
					}
				});

				// The crypto engines and the collection stores arrive as module
				// scripts, which are deferred: they run after this classic script but
				// before DOMContentLoaded. Waiting on sodium.ready alone races them —
				// libsodium can resolve within a microtask, leaving __createScopeKeys
				// still undefined.
				function modulesReady() {
					if (document.readyState !== 'loading') return Promise.resolve();
					return new Promise(function (resolve) {
						document.addEventListener('DOMContentLoaded', resolve, { once: true });
					});
				}

				(async function init() {
					await modulesReady();
					await sodium.ready;
					b64 = sodium.base64_variants.ORIGINAL;
					// Scope-key engine — ready before any unlock derives scopeMaster.
					scopeKeysApi = window.__createScopeKeys(sodium);
					spaceApi = window.__createSpaceKeys(sodium);
					// Announce readiness so the embedder knows it can send vault-init.
					// targetOrigin '*' is safe: the message carries no secret.
					window.parent.postMessage({ type: 'vault-loaded' }, '*');
				})();
			})();
		</script>
	</body>
</html>
