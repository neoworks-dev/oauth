<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Google Calendar · NeoWorks</title>
		<link rel="stylesheet" href="/auth/static/neoworks.css" />
	</head>
	<body>
		<div class="card">
			<div class="logo">
				<svg width="20" height="20" viewBox="0 0 100 100" fill="none" aria-hidden="true">
					<circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="7" />
					<path d="M 81 27 C 73 51, 55 69, 26 74" stroke="currentColor" stroke-width="7" stroke-linecap="round" />
				</svg>
				<span>NeoWorks</span>
			</div>
			<h1 id="heading">Finishing up…</h1>
			<p class="subtitle" id="detail">You can close this window.</p>
			<div class="footnote">
				Events you sync to Google are stored on Google's servers in plain text.
				NeoWorks cannot read them; Google can.
			</div>
		</div>

		<script>
			(function () {
				// Origins of the opening client's registered redirect URIs — the same
				// trust source the sign-in prompt and the unlock window use. The result
				// carries no secret, only whether the link succeeded, but posting it to
				// exactly the app that started the flow keeps the surface honest.
				const ALLOWED_ORIGINS = {{.AllowedOriginsJSON}};
				const RESULT = {{.ResultJSON}};

				const heading = document.getElementById('heading');
				const detail = document.getElementById('detail');

				if (RESULT.ok) {
					heading.textContent = 'Google account linked';
					detail.textContent = 'You can close this window.';
				} else {
					heading.textContent = 'Could not link your Google account';
					detail.textContent = 'Close this window and try again.';
				}

				if (window.opener) {
					for (const origin of ALLOWED_ORIGINS) {
						window.opener.postMessage(RESULT, origin);
					}
				}

				// Give the opener a moment to receive the message before the window goes.
				if (RESULT.ok) {
					setTimeout(() => window.close(), 500);
				}
			})();
		</script>
	</body>
</html>
